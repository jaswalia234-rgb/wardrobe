<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>wardrobe</title>
  <style>
    :root {
      --bg-color: #fcf6f8;
      --card-bg: rgba(255, 255, 255, 0.7);
      --accent: #f4c2c2;
      --accent-hover: #eaa8a8;
      --text-color: #4a3e3e;
      --subtext: #9e8a8a;
      --radius-lg: 20px;
      --radius-md: 14px;
      --font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-family);
      text-transform: lowercase;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 500;
      color: var(--text-color);
      letter-spacing: -0.5px;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    @media (min-width: 768px) {
      .dashboard-grid {
        grid-template-columns: 320px 1fr;
      }
    }

    .preview-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: var(--radius-lg);
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      box-shadow: 0 10px 25px rgba(244, 194, 194, 0.15);
      position: sticky;
      top: 20px;
      height: fit-content;
    }

    .outfit-display-canvas {
      width: 100%;
      height: 320px;
      background: #ffffff;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 1px solid rgba(244, 194, 194, 0.3);
    }

    .outfit-display-canvas canvas {
      width: 100%;
      height: 100%;
    }

    .btn-sync {
      width: 100%;
      padding: 12px 18px;
      background: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-md);
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    .btn-sync:hover { background: var(--accent-hover); }
    .btn-sync:active { transform: scale(0.98); }

    .carousel-section {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .category-group {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: var(--radius-lg);
      padding: 16px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.02);
    }

    .category-title {
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--subtext);
      margin-bottom: 12px;
    }

    .carousel {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      padding-bottom: 6px;
      -webkit-overflow-scrolling: touch;
    }

    .carousel::-webkit-scrollbar { height: 4px; }
    .carousel::-webkit-scrollbar-thumb {
      background: var(--accent);
      border-radius: 4px;
    }

    .item-card {
      flex: 0 0 100px;
      height: 110px;
      background: #ffffff;
      border-radius: var(--radius-md);
      padding: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      scroll-snap-align: start;
      border: 2px solid transparent;
      transition: all 0.2s ease;
    }

    .item-card.selected {
      border-color: var(--accent);
      background: #fffafa;
    }

    .item-card img {
  width: 70px;
  height: 70px;
  object-fit: contain; /* prevents distortion on carousel thumbnails */
}

    .item-card span {
      font-size: 0.75rem;
      color: var(--text-color);
      margin-top: 6px;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>wardrobe</h1>

    <div class="dashboard-grid">
      
      <div class="preview-card">
        <div class="category-title">tomorrow's outfit</div>
        <div class="outfit-display-canvas">
          <canvas id="outfit-canvas" width="300" height="320"></canvas>
        </div>
        <button class="btn-sync" onclick="saveOutfit()">save outfit to notion</button>
      </div>

      <div class="carousel-section">
        <div class="category-group">
          <div class="category-title">tops</div>
          <div class="carousel" id="carousel-top"></div>
        </div>

        <div class="category-group">
          <div class="category-title">bottoms</div>
          <div class="carousel" id="carousel-bottom"></div>
        </div>

        <div class="category-group">
          <div class="category-title">shoes</div>
          <div class="carousel" id="carousel-shoes"></div>
        </div>

        <div class="category-group">
          <div class="category-title">outerwear</div>
          <div class="carousel" id="carousel-outerwear"></div>
        </div>
      </div>

    </div>
  </div>

  <script>
    const WORKER_URL = "https://wardrobe-proxy.jaswalia234.workers.dev/"; // e.g. https://wardrobe-proxy.username.workers.dev
    const NOTION_TOKEN = "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";
    const WARDROBE_DB_ID = "40eaedaf73e8806dbddfdef92af3548e";

    let wardrobeItems = [];
    let selectedOutfit = { top: null, bottom: null, shoes: null, outerwear: null };

    async function fetchFromNotion() {
  const notionEndpoint = `https://api.notion.com/v1/databases/${WARDROBE_DB_ID}/query`;
  const proxiedUrl = `${WORKER_URL}?url=${encodeURIComponent(notionEndpoint)}`;

  try {
    const response = await fetch(proxiedUrl, {
      method: "POST",
      headers: {
        "Authorization": `Bearer ${NOTION_TOKEN}`,
        "Notion-Version": "2022-06-28",
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        filter: {
          property: "status",
          select: { equals: "clean" } // strictly fetch clean items
        }
      })
    });

    const data = await response.json();
    if (!data.results) return;

    wardrobeItems = data.results.map(page => {
      const props = page.properties;
      
      // 1. Get exact item title from "name" property
      const titleObj = props.name || props.Name || props.Title;
      const itemName = titleObj?.title?.[0]?.plain_text?.toLowerCase() || "unnamed";

      // 2. Normalize plural category names (e.g. "bottoms" -> "bottom")
      let cat = props.category?.select?.name?.toLowerCase() || "top";
      if (cat === "bottoms") cat = "bottom";
      if (cat === "shoes" || cat === "shoe") cat = "shoes";

      // 3. Extract file URL from "image url" property
      let rawImgUrl = "";
      const imgProp = props["image url"] || props["Image URL"] || props["Image"] || props["image"];
      
      if (imgProp?.files?.[0]) {
        rawImgUrl = imgProp.files[0].file?.url || imgProp.files[0].external?.url || "";
      } else if (imgProp?.url) {
        rawImgUrl = imgProp.url;
      } else if (imgProp?.rich_text?.[0]?.plain_text) {
        rawImgUrl = imgProp.rich_text[0].plain_text;
      }

      // Proxy image through Cloudflare Worker
      const proxiedImgUrl = rawImgUrl ? `${WORKER_URL}?type=image&url=${encodeURIComponent(rawImgUrl)}` : "";

      return {
        id: page.id,
        name: itemName,
        category: cat,
        url: proxiedImgUrl
      };
    });

    renderCarousels();
  } catch (err) {
    console.error("error fetching notion wardrobe:", err);
  }
}

    function renderCarousels() {
      const categories = ['top', 'bottom', 'shoes', 'outerwear'];

      categories.forEach(cat => {
        const container = document.getElementById(`carousel-${cat}`);
        if (!container) return;

        const catItems = wardrobeItems.filter(i => i.category === cat);

        if (catItems.length === 0) {
          container.innerHTML = `<span style="font-size:0.8rem; color:var(--subtext); padding:8px;">no clean ${cat}s found</span>`;
          return;
        }

        container.innerHTML = catItems.map(item => `
          <div class="item-card" onclick="selectItem('${cat}', '${item.url}', '${item.name}', this)">
            <img src="${item.url}" alt="${item.name}" crossorigin="anonymous" />
            <span>${item.name}</span>
          </div>
        `).join('');
      });
    }

    function selectItem(category, url, name, element) {
      const parent = element.parentElement;
      parent.querySelectorAll('.item-card').forEach(el => el.classList.remove('selected'));
      element.classList.add('selected');

      selectedOutfit[category] = { url, name };
      drawOutfitCanvas();
    }

async function drawOutfitCanvas() {
  const canvas = document.getElementById('outfit-canvas');
  const ctx = canvas.getContext('2d');
  
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.scale(dpr, dpr);

  ctx.clearRect(0, 0, rect.width, rect.height);
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, rect.width, rect.height);

  const centerX = rect.width / 2;

  // cute minimalistic character silhouette
  ctx.save();
  ctx.fillStyle = "#f8e2e5";
  ctx.strokeStyle = "#e8b4b8";
  ctx.lineWidth = 1.2;

  // hair / top knot
  ctx.beginPath();
  ctx.arc(centerX, 28, 6, 0, Math.PI * 2);
  ctx.fill();

  // head
  ctx.beginPath();
  ctx.arc(centerX, 42, 13, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  // neck & collar
  ctx.fillRect(centerX - 2, 54, 4, 8);

  // torso (slender, soft line)
  ctx.beginPath();
  ctx.moveTo(centerX - 15, 62);
  ctx.quadraticCurveTo(centerX - 10, 100, centerX - 11, 140);
  ctx.lineTo(centerX + 11, 140);
  ctx.quadraticCurveTo(centerX + 10, 100, centerX + 15, 62);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // cute stance legs
  ctx.beginPath();
  ctx.roundRect(centerX - 9, 140, 6, 95, 3);
  ctx.roundRect(centerX + 3, 140, 6, 95, 3);
  ctx.fill();

  // arms
  ctx.beginPath();
  ctx.roundRect(centerX - 21, 64, 5, 75, 2.5);
  ctx.roundRect(centerX + 16, 64, 5, 75, 2.5);
  ctx.fill();

  ctx.restore();

  // layer clothing items over character
  const layers = ['bottom', 'top', 'outerwear', 'shoes'];

  for (const layer of layers) {
    if (selectedOutfit[layer] && selectedOutfit[layer].url) {
      await new Promise((resolve) => {
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.src = selectedOutfit[layer].url;
        img.onload = () => {
          let size = 120;
          let yPos = 55;

          if (layer === 'top') { size = 130; yPos = 52; }
          if (layer === 'bottom') { size = 125; yPos = 110; }
          if (layer === 'outerwear') { size = 145; yPos = 48; }
          if (layer === 'shoes') { size = 85; yPos = 215; }

          const xPos = (rect.width - size) / 2;
          ctx.drawImage(img, xPos, yPos, size, size);
          resolve();
        };
        img.onerror = () => resolve();
      });
    }
  }
}
    function saveOutfit() {
      const canvas = document.getElementById('outfit-canvas');
      const imageDataUrl = canvas.toDataURL('image/png');
      console.log("compiled outfit image ready:", imageDataUrl);
      alert("outfit compiled!");
    }

    fetchFromNotion();
  </script>
</body>
</html>
