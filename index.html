<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>wardrobe</title>
  <style>
    :root {
      --bg-color: #fcf6f8;
      --card-bg: rgba(255, 255, 255, 0.75);
      --accent: #f4c2c2;
      --accent-hover: #eaa8a8;
      --text-color: #4a3e3e;
      --subtext: #9e8a8a;
      --radius-lg: 20px;
      --radius-md: 14px;
      --font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-family);
      text-transform: lowercase;
    }

    html, body {
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
      background-color: var(--bg-color);
      color: var(--text-color);
    }

    body {
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 1050px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 500;
      color: var(--text-color);
      letter-spacing: -0.5px;
    }

    .btn-clear-all {
      padding: 8px 14px;
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--text-color);
      border-radius: 20px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-clear-all:hover {
      background: var(--accent);
      color: #ffffff;
    }

    .filter-bar {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: var(--radius-lg);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 4px 15px rgba(244, 194, 194, 0.1);
    }

    .search-row {
      display: flex;
      gap: 10px;
      width: 100%;
      flex-wrap: wrap;
    }

    .search-input {
      flex: 2;
      min-width: 180px;
      padding: 10px 14px;
      border: 1px solid rgba(244, 194, 194, 0.5);
      border-radius: 20px;
      font-size: 0.85rem;
      background: rgba(255, 255, 255, 0.9);
      color: var(--text-color);
      outline: none;
    }

    .search-input::placeholder { color: var(--subtext); }

    .dropdown-select {
      flex: 1;
      min-width: 120px;
      padding: 8px 14px;
      border: 1px solid rgba(244, 194, 194, 0.5);
      border-radius: 20px;
      font-size: 0.8rem;
      background: rgba(255, 255, 255, 0.9);
      color: var(--text-color);
      outline: none;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      text-align: center;
    }

    .tag-filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .filter-chip {
      padding: 6px 14px;
      background: #ffffff;
      border: 1px solid rgba(244, 194, 194, 0.4);
      border-radius: 20px;
      font-size: 0.78rem;
      color: var(--text-color);
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
    }

    .filter-chip.active {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      width: 100%;
    }

    @media (min-width: 768px) {
      .dashboard-grid {
        grid-template-columns: 310px minmax(0, 1fr);
      }
    }

    .preview-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: var(--radius-lg);
      padding: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      box-shadow: 0 10px 25px rgba(244, 194, 194, 0.15);
      position: sticky;
      top: 16px;
      height: fit-content;
    }

    .outfit-display-canvas {
      width: 100%;
      height: 330px;
      background: #ffffff;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 1px solid rgba(244, 194, 194, 0.3);
    }

    .outfit-display-canvas canvas {
      width: 100%;
      height: 100%;
    }

    .controls-panel {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: rgba(255, 255, 255, 0.6);
      padding: 12px 16px;
      border-radius: var(--radius-md);
      border: 1px solid rgba(244, 194, 194, 0.3);
    }

    .control-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: var(--text-color);
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 38px;
      height: 20px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #e0d0d5;
      transition: .2s;
      border-radius: 20px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .2s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: var(--accent);
    }

    input:checked + .slider:before {
      transform: translateX(18px);
    }

    .btn-sync {
      width: 100%;
      padding: 12px;
      background: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-md);
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .btn-sync:hover { background: var(--accent-hover); }

    .carousel-section {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
      min-width: 0;
    }

    .category-group {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: var(--radius-lg);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .category-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .category-title {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--subtext);
    }

    .category-filters-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .btn-clear-cat {
      background: none;
      border: none;
      color: var(--subtext);
      font-size: 0.75rem;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 10px;
    }

    .btn-clear-cat:hover {
      background: rgba(244, 194, 194, 0.3);
      color: var(--text-color);
    }

    .carousel-wrapper {
      position: relative;
      width: 100%;
      display: flex;
      align-items: center;
    }

    .carousel {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      padding-bottom: 4px;
      -webkit-overflow-scrolling: touch;
      width: 100%;
      scroll-behavior: smooth;
    }

    .carousel::-webkit-scrollbar { height: 4px; }
    .carousel::-webkit-scrollbar-thumb {
      background: var(--accent);
      border-radius: 4px;
    }

    .carousel-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 28px;
      height: 28px;
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid var(--accent);
      color: var(--text-color);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      transition: all 0.2s ease;
      opacity: 0;
      pointer-events: none;
      font-size: 0.75rem;
    }

    .carousel-arrow.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .carousel-arrow:hover {
      background: var(--accent);
      color: #ffffff;
    }

    .carousel-arrow.left { left: -6px; }
    .carousel-arrow.right { right: -6px; }

    .item-card {
      flex: 0 0 95px;
      height: 105px;
      background: #ffffff;
      border-radius: var(--radius-md);
      padding: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      scroll-snap-align: start;
      border: 2px solid transparent;
      transition: all 0.2s ease;
    }

    .item-card.selected {
      border-color: var(--accent);
      background: #fffafa;
    }

    .item-card img {
      width: 60px;
      height: 60px;
      object-fit: contain;
    }

    .item-card span {
      font-size: 0.72rem;
      color: var(--text-color);
      margin-top: 4px;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }
  </style>
</head>
<body>

    function quickSetName(name) {
      document.getElementById('outfit-name-input').value = name;
    }

    function getOrdinalSuffix(day) {
      if (day > 3 && day < 21) return 'th';
      switch (day % 10) {
        case 1:  return "st";
        case 2:  return "nd";
        case 3:  return "rd";
        default: return "th";
      }
    }

    function formatCustomDateString(dateObj) {
      const dayName = dateObj.toLocaleDateString('en-GB', { weekday: 'long' }).toLowerCase();
      const monthName = dateObj.toLocaleDateString('en-GB', { month: 'long' }).toLowerCase();
      const dayNum = dateObj.getDate();
      const ordinal = getOrdinalSuffix(dayNum);

      return `${dayName} ${dayNum}${ordinal} ${monthName}`;
    }

    function formatUUID(id) {
      if (!id) return "";
      const clean = id.replace(/-/g, "");
      if (clean.length !== 32) return id;
      return `${clean.slice(0,8)}-${clean.slice(8,12)}-${clean.slice(12,16)}-${clean.slice(16,20)}-${clean.slice(20)}`;
    }

    function getColorWeight(colorName) {
      const c = colorName.toLowerCase();
      if (c.includes('white') || c.includes('cream') || c.includes('ivory') || c.includes('nude')) return 10;
      if (c.includes('pink') || c.includes('rose') || c.includes('blush')) return 20;
      if (c.includes('red') || c.includes('burgundy') || c.includes('maroon') || c.includes('wine')) return 30;
      if (c.includes('orange') || c.includes('rust') || c.includes('peach')) return 40;
      if (c.includes('yellow') || c.includes('gold') || c.includes('mustard')) return 50;
      if (c.includes('sage') || c.includes('mint') || c.includes('light green')) return 60;
      if (c.includes('green') || c.includes('khaki') || c.includes('olive') || c.includes('emerald') || c.includes('dark green')) return 70;
      if (c.includes('light blue') || c.includes('sky') || c.includes('baby blue')) return 80;
      if (c.includes('blue') || c.includes('denim') || c.includes('cobalt') || c.includes('royal')) return 85;
      if (c.includes('navy') || c.includes('dark blue')) return 88;
      if (c.includes('lilac') || c.includes('lavender') || c.includes('purple') || c.includes('violet') || c.includes('plum')) return 90;
      if (c.includes('beige') || c.includes('tan') || c.includes('camel') || c.includes('brown') || c.includes('chocolate')) return 100;
      if (c.includes('light grey') || c.includes('silver')) return 110;
      if (c.includes('grey') || c.includes('gray') || c.includes('charcoal')) return 115;
      if (c.includes('black')) return 120;
      return 200;
    }

    async function fetchFromNotion() {
  // 1. Instant load from local cache if available
  const cachedData = localStorage.getItem('cached_wardrobe_items');

    try {
      wardrobeItems = JSON.parse(cachedData);
      populateColourDropdown();
      buildDynamicTagChips();
      renderCarousels(wardrobeItems);

  // 2. Fetch fresh data from Notion in the background
  const notionEndpoint = `https://api.notion.com/v1/databases/${WARDROBE_DB_ID}/query`;
  const proxiedUrl = `${WORKER_URL}?url=${encodeURIComponent(notionEndpoint)}`;

  try {
    const response = await fetch(proxiedUrl, {
      method: "POST",
      headers: {
        "Authorization": `Bearer ${NOTION_TOKEN}`,
        "Notion-Version": "2022-06-28",
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        filter: { property: "status", select: { equals: "clean" } },
        page_size: 100
      })
    });

    const data = await response.json();
    if (!data.results) return;

    wardrobeItems = data.results.map(page => {
      const props = page.properties;

      const titleObj = props.name || props.Name || props.Title;
      const itemName = titleObj?.title?.[0]?.plain_text?.toLowerCase() || "unnamed";

      let cat = props.category?.select?.name?.toLowerCase() || "top";
      if (cat === "bottoms") cat = "bottom";
      if (cat === "dress") cat = "dresses";

      const colourProp = props.colour || props.Colour || props.color || props.Color;
      const colors = [];
      if (colourProp?.multi_select) {
        colourProp.multi_select.forEach(c => colors.push(c.name.toLowerCase()));
      } else if (colourProp?.select?.name) {
        colors.push(colourProp.select.name.toLowerCase());
      } else if (colourProp?.rich_text?.[0]?.plain_text) {
        colors.push(colourProp.rich_text[0].plain_text.toLowerCase());
      }

      const tagsProp = props.tags || props.Tags;
      const tags = tagsProp?.multi_select?.map(t => t.name.toLowerCase()) || [];

      let rawImgUrl = "";
      const imgProp = props["image url"] || props["Image URL"] || props["Image"] || props["image"];
      if (imgProp?.files?.[0]) {
        rawImgUrl = imgProp.files[0].file?.url || imgProp.files[0].external?.url || "";
      } else if (imgProp?.url) {
        rawImgUrl = imgProp.url;
      }

      const proxiedImgUrl = rawImgUrl ? `${WORKER_URL}?type=image&url=${encodeURIComponent(rawImgUrl)}` : "";

      return {
        id: page.id,
        name: itemName,
        category: cat,
        colors: colors,
        tags: tags,
        url: proxiedImgUrl
      };
    });

    // Save updated items to LocalStorage for next time
    localStorage.setItem('cached_wardrobe_items', JSON.stringify(wardrobeItems));

    // Update UI silently
    populateColourDropdown();
    buildDynamicTagChips();
    renderCarousels(wardrobeItems);
    drawOutfitCanvas();

  } catch (err) {
    console.error("error fetching notion wardrobe:", err);
  }
}

    function preloadInitialImages() {
      const categories = ['top', 'bottom', 'dresses', 'shoes', 'outerwear'];
      categories.forEach(cat => {
        const catItems = wardrobeItems.filter(i => i.category === cat).slice(0, 3);
        catItems.forEach(item => {
          if (item.url) loadImage(item.url);
        });
      });
    }

    function populateColourDropdown() {
      const allColours = new Set();
      wardrobeItems.forEach(item => {
        item.colors.forEach(c => allColours.add(c));
      });

      const sortedColours = Array.from(allColours).sort((a, b) => {
        const weightA = getColorWeight(a);
        const weightB = getColorWeight(b);
        if (weightA === weightB) return a.localeCompare(b);
        return weightA - weightB;
      });

      const select = document.getElementById("colour-select");
      select.innerHTML = '<option value="">all colours</option>' + 
        sortedColours.map(c => `<option value="${c}">${c}</option>`).join('');
    }

    function buildDynamicTagChips() {
      const excludedOptionTags = new Set([
        'comfy', 'winter', 'loungewear', 'club', 'new', 'matching set', 'booby',
        'shein', 'primark', 'plt', 'hollister', 'victoria secret', 'other',
        'tight', 'baggy', 'maxi', 'mini', 'midi', 'cropped', 'extra cropped', 'not cropped',
        'long-sleeved', 'short-sleeved', 'no sleeves', 'sweater', 'hoodie', 'shirt', 'top',
        'joggers', 'jeans', 'skirt', 'shorts'
      ]);

      const dynamicTags = new Set();
      wardrobeItems.forEach(item => {
        item.tags.forEach(t => {
          if (!excludedOptionTags.has(t)) dynamicTags.add(t);
        });
      });

      const container = document.getElementById("dynamic-tag-chips");
      container.innerHTML = Array.from(dynamicTags).map(tag => `
        <div class="filter-chip" onclick="toggleTagFilter('${tag}', this)">${tag}</div>
      `).join('');
    }

    function toggleTagFilter(tag, element) {
      if (activeTags.has(tag)) {
        activeTags.delete(tag);
        element.classList.remove("active");
      } else {
        activeTags.add(tag);
        element.classList.add("active");
      }
      applyFilters();
    }

    function debouncedApplyFilters() {
      clearTimeout(filterDebounceTimer);
      filterDebounceTimer = setTimeout(applyFilters, 100);
    }

    function applyFilters() {
      const searchQuery = document.getElementById("search-box").value.toLowerCase().trim();
      const selectedColour = document.getElementById("colour-select").value.toLowerCase();
      const selectedBrand = document.getElementById("brand-select").value.toLowerCase();
      const selectedFit = document.getElementById("fit-select").value.toLowerCase();

      const topType = document.getElementById("top-type-select").value.toLowerCase();
      const topCrop = document.getElementById("top-crop-select").value.toLowerCase();
      const topSleeve = document.getElementById("top-sleeve-select").value.toLowerCase();

      const bottomType = document.getElementById("bottom-type-select").value.toLowerCase();

      const dressLength = document.getElementById("dress-length-select").value.toLowerCase();
      const dressSleeve = document.getElementById("dress-sleeve-select").value.toLowerCase();

      const knownBrands = ['shein', 'primark', 'plt', 'hollister', 'victoria secret'];

      const filtered = wardrobeItems.filter(item => {
        const matchesSearch = !searchQuery || item.name.includes(searchQuery);
        const matchesColour = !selectedColour || item.colors.includes(selectedColour);

        let matchesBrand = true;
        if (selectedBrand) {
          if (selectedBrand === 'other') {
            matchesBrand = !item.tags.some(t => knownBrands.includes(t));
          } else {
            matchesBrand = item.tags.includes(selectedBrand);
          }
        }

        const matchesFit = !selectedFit || item.tags.includes(selectedFit);
        const matchesTags = activeTags.size === 0 || Array.from(activeTags).every(t => item.tags.includes(t));

        let matchesCatFilters = true;
        if (item.category === 'top') {
          if (topType && !item.tags.includes(topType)) matchesCatFilters = false;
          if (topCrop && !item.tags.includes(topCrop)) matchesCatFilters = false;
          if (topSleeve && !item.tags.includes(topSleeve)) matchesCatFilters = false;
        } else if (item.category === 'bottom') {
          if (bottomType && !item.tags.includes(bottomType)) matchesCatFilters = false;
        } else if (item.category === 'dresses') {
          if (dressLength && !item.tags.includes(dressLength)) matchesCatFilters = false;
          if (dressSleeve && !item.tags.includes(dressSleeve)) matchesCatFilters = false;
        }

        return matchesSearch && matchesColour && matchesBrand && matchesFit && matchesTags && matchesCatFilters;
      });

      renderCarousels(filtered);
    }

    function renderCarousels(items) {
      const categories = ['top', 'bottom', 'dresses', 'shoes', 'outerwear'];

      categories.forEach(cat => {
        const container = document.getElementById(`carousel-${cat}`);
        if (!container) return;

        const catItems = items.filter(i => i.category === cat);

        if (catItems.length === 0) {
          container.innerHTML = `<span style="font-size:0.75rem; color:var(--subtext); padding:6px;">no matching ${cat}s</span>`;
        } else {
          container.innerHTML = catItems.map(item => `
            <div class="item-card ${selectedOutfit[cat]?.id === item.id ? 'selected' : ''}" 
                 onclick="selectItem('${cat}', '${item.id}', this)">
              <img src="${item.url}" alt="${item.name}" loading="lazy" decoding="async" crossorigin="anonymous" />
              <span>${item.name}</span>
            </div>
          `).join('');
        }

        setTimeout(() => checkCarouselArrows(cat), 30);
      });
    }

    function scrollCarousel(cat, offset) {
      const container = document.getElementById(`carousel-${cat}`);
      if (!container) return;
      container.scrollBy({ left: offset, behavior: 'smooth' });
    }

    function checkCarouselArrows(cat) {
      const container = document.getElementById(`carousel-${cat}`);
      const leftArrow = document.getElementById(`arrow-left-${cat}`);
      const rightArrow = document.getElementById(`arrow-right-${cat}`);
      if (!container || !leftArrow || !rightArrow) return;

      const scrollLeft = container.scrollLeft;
      const maxScroll = container.scrollWidth - container.clientWidth;

      if (scrollLeft > 5) {
        leftArrow.classList.add("visible");
      } else {
        leftArrow.classList.remove("visible");
      }

      if (scrollLeft < maxScroll - 5 && maxScroll > 0) {
        rightArrow.classList.add("visible");
      } else {
        rightArrow.classList.remove("visible");
      }
    }

    function selectItem(category, itemId, element) {
      const item = wardrobeItems.find(i => i.id === itemId);
      if (!item) return;

      if (category === 'dresses') {
        selectedOutfit.top = null;
        selectedOutfit.bottom = null;
      } else if (category === 'top' || category === 'bottom') {
        selectedOutfit.dresses = null;
      }

      selectedOutfit[category] = item;

      applyFilters();
      drawOutfitCanvas();
    }

    function clearCategory(category) {
      selectedOutfit[category] = null;
      applyFilters();
      drawOutfitCanvas();
    }

    function clearAllOutfit() {
      selectedOutfit = { top: null, bottom: null, dresses: null, shoes: null, outerwear: null };
      applyFilters();
      drawOutfitCanvas();
    }

    function loadImage(url) {
      if (imageCache[url]) return Promise.resolve(imageCache[url]);
      return new Promise((resolve) => {
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.src = url;
        img.onload = () => {
          imageCache[url] = img;
          resolve(img);
        };
        img.onerror = () => resolve(null);
      });
    }

    async function drawOutfitCanvas() {
      const canvas = document.getElementById('outfit-canvas');
      const ctx = canvas.getContext('2d');
      
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);

      ctx.clearRect(0, 0, rect.width, rect.height);
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, rect.width, rect.height);

      const personImg = await loadImage(PERSON_IMAGE_URL);
      if (personImg) {
        const personHeight = 310;
        const personWidth = 140;
        const xPos = (rect.width - personWidth) / 2;
        ctx.drawImage(personImg, xPos, 10, personWidth, personHeight);
      }

      const layers = ['dresses', 'bottom', 'top', 'shoes', 'outerwear'];
      const activeLayers = layers.filter(layer => selectedOutfit[layer] && selectedOutfit[layer].url);

      const loadedLayerImages = await Promise.all(
        activeLayers.map(layer => loadImage(selectedOutfit[layer].url).then(img => ({ layer, img })))
      );

      loadedLayerImages.forEach(({ layer, img }) => {
        if (!img) return;

        let width = 110;
        let height = 110;
        let yPos = 45;
        let xPos = (rect.width - width) / 2;

        if (layer === 'dresses') {
          width = 120;
          height = 210;
          yPos = 42;
          xPos = (rect.width - width) / 2;
        } else if (layer === 'top') { 
          width = 110; 
          height = 110;
          yPos = 45; 
          xPos = (rect.width - width) / 2;
        } else if (layer === 'bottom') { 
          width = 145; 
          height = 145;
          yPos = 148; 
          xPos = (rect.width - width) / 2;
        } else if (layer === 'shoes') { 
          width = 80; 
          height = 80;
          yPos = 245; 
          xPos = (rect.width - width) / 2;
        } else if (layer === 'outerwear') { 
          width = 120; 
          height = 120;
          yPos = 55;
          xPos = rect.width - width - 10;
        }

        ctx.drawImage(img, xPos, yPos, width, height);
      });
    }

    async function saveOutfit() {
      const canvas = document.getElementById('outfit-canvas');
      const canvasDataBase64 = canvas.toDataURL('image/png');

      const customDateVal = document.getElementById('outfit-date-picker').value || new Date().toISOString().split('T')[0];
      
      const [year, month, day] = customDateVal.split('-');
      const selectedDateObj = new Date(year, month - 1, day);

      const formattedDateStr = formatCustomDateString(selectedDateObj);

      const customNameInput = document.getElementById('outfit-name-input').value.trim().toLowerCase();
      const outfitName = customNameInput || "outfit";

      const pageTitle = `${formattedDateStr} - ${outfitName}`;

      const braState = document.getElementById('bra-switch').checked ? 'yes' : 'no';
      const tightsState = document.getElementById('tights-switch').checked ? 'yes' : 'no';

      const relationIds = Object.values(selectedOutfit)
        .filter(item => item !== null && item.id)
        .map(item => ({ id: formatUUID(item.id) }));

      const payload = {
        parentDatabaseId: formatUUID(OUTFIT_LOG_DB_ID),
        title: pageTitle,
        date: customDateVal,
        relations: relationIds,
        bra: braState,
        tights: tightsState,
        imageBase64: canvasDataBase64,
        imgbbKey: IMGBB_API_KEY
      };

      try {
        const response = await fetch(`${WORKER_URL}?action=save-outfit-with-image`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const resData = await response.json();

        if (response.ok) {
          alert(`saved as "${pageTitle}" to notion!`);
        } else {
          console.error("notion error details:", resData);
          alert(`failed: ${resData.message || 'check console'}`);
        }
      } catch (err) {
        console.error("error saving to notion:", err);
        alert("network error saving to notion.");
      }
    }

    fetchFromNotion();
  </script>
