<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>wardrobe</title>
  <style>
    :root {
      --bg-color: #fcf6f8;
      --card-bg: rgba(255, 255, 255, 0.75);
      --accent: #f4c2c2;
      --accent-hover: #eaa8a8;
      --text-color: #4a3e3e;
      --subtext: #9e8a8a;
      --radius-lg: 20px;
      --radius-md: 14px;
      --font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-family);
      text-transform: lowercase;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 950px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 500;
      color: var(--text-color);
      letter-spacing: -0.5px;
    }

    /* search and filters header */
    .filter-bar {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: var(--radius-lg);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 4px 15px rgba(244, 194, 194, 0.1);
    }

    .search-input {
      width: 100%;
      padding: 10px 16px;
      border: 1px solid rgba(244, 194, 194, 0.5);
      border-radius: var(--radius-md);
      font-size: 0.9rem;
      background: rgba(255, 255, 255, 0.9);
      color: var(--text-color);
      outline: none;
    }

    .search-input::placeholder { color: var(--subtext); }

    .tag-filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-chip {
      padding: 6px 12px;
      background: #ffffff;
      border: 1px solid rgba(244, 194, 194, 0.4);
      border-radius: 20px;
      font-size: 0.8rem;
      color: var(--text-color);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .filter-chip.active {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }

    /* layout grid */
    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    @media (min-width: 768px) {
      .dashboard-grid {
        grid-template-columns: 320px 1fr;
      }
    }

    /* preview card */
    .preview-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: var(--radius-lg);
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      box-shadow: 0 10px 25px rgba(244, 194, 194, 0.15);
      position: sticky;
      top: 20px;
      height: fit-content;
    }

    .outfit-display-canvas {
      width: 100%;
      height: 340px;
      background: #ffffff;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 1px solid rgba(244, 194, 194, 0.3);
    }

    .outfit-display-canvas canvas {
      width: 100%;
      height: 100%;
    }

    .btn-sync {
      width: 100%;
      padding: 12px 18px;
      background: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-md);
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .btn-sync:hover { background: var(--accent-hover); }

    /* category carousels */
    .carousel-section {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .category-group {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: var(--radius-lg);
      padding: 16px;
    }

    .category-title {
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--subtext);
      margin-bottom: 12px;
    }

    .carousel {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      padding-bottom: 6px;
      -webkit-overflow-scrolling: touch;
    }

    .carousel::-webkit-scrollbar { height: 4px; }
    .carousel::-webkit-scrollbar-thumb {
      background: var(--accent);
      border-radius: 4px;
    }

    .item-card {
      flex: 0 0 100px;
      height: 110px;
      background: #ffffff;
      border-radius: var(--radius-md);
      padding: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      scroll-snap-align: start;
      border: 2px solid transparent;
      transition: all 0.2s ease;
    }

    .item-card.selected {
      border-color: var(--accent);
      background: #fffafa;
    }

    .item-card img {
      width: 65px;
      height: 65px;
      object-fit: contain;
    }

    .item-card span {
      font-size: 0.75rem;
      color: var(--text-color);
      margin-top: 6px;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>wardrobe</h1>

    <!-- search & filter bar -->
    <div class="filter-bar">
      <input type="text" class="search-input" id="search-box" placeholder="search items by name, color, tag..." oninput="applyFilters()" />
      <div class="tag-filters" id="tag-chips">
        <!-- filter chips render dynamically -->
      </div>
    </div>

    <div class="dashboard-grid">
      
      <!-- outfit canvas preview -->
      <div class="preview-card">
        <div class="category-title">tomorrow's outfit</div>
        <div class="outfit-display-canvas">
          <canvas id="outfit-canvas" width="300" height="340"></canvas>
        </div>
        <button class="btn-sync" onclick="saveOutfit()">save outfit to notion</button>
      </div>

      <!-- category carousels -->
      <div class="carousel-section">
        <div class="category-group">
          <div class="category-title">tops</div>
          <div class="carousel" id="carousel-top"></div>
        </div>

        <div class="category-group">
          <div class="category-title">bottoms</div>
          <div class="carousel" id="carousel-bottom"></div>
        </div>

        <div class="category-group">
          <div class="category-title">shoes</div>
          <div class="carousel" id="carousel-shoes"></div>
        </div>

        <div class="category-group">
          <div class="category-title">outerwear</div>
          <div class="carousel" id="carousel-outerwear"></div>
        </div>
      </div>

    </div>
  </div>

  <script>
    const WORKER_URL = "https://wardrobe-proxy.jaswalia234.workers.dev";
    const NOTION_TOKEN = "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";
    const WARDROBE_DB_ID = "40eaedaf73e8806dbddfdef92af3548e";

    // LINK TO YOUR TRANSPARENT PERSON PNG ILLUSTRATION
    const PERSON_IMAGE_URL = "images/person.png"; 

    let wardrobeItems = [];
    let activeTags = new Set();
    let selectedOutfit = { top: null, bottom: null, shoes: null, outerwear: null };

    async function fetchFromNotion() {
      const notionEndpoint = `https://api.notion.com/v1/databases/${WARDROBE_DB_ID}/query`;
      const proxiedUrl = `${WORKER_URL}?url=${encodeURIComponent(notionEndpoint)}`;

      try {
        const response = await fetch(proxiedUrl, {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${NOTION_TOKEN}`,
            "Notion-Version": "2022-06-28",
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            filter: { property: "status", select: { equals: "clean" } }
          })
        });

        const data = await response.json();
        if (!data.results) return;

        wardrobeItems = data.results.map(page => {
          const props = page.properties;

          // Name
          const titleObj = props.name || props.Name || props.Title;
          const itemName = titleObj?.title?.[0]?.plain_text?.toLowerCase() || "unnamed";

          // Category
          let cat = props.category?.select?.name?.toLowerCase() || "top";
          if (cat === "bottoms") cat = "bottom";

          // Colors & Tags
          const colors = props.color?.multi_select?.map(c => c.name.toLowerCase()) || [];
          const tags = props.tags?.multi_select?.map(t => t.name.toLowerCase()) || [];
          if (props.color?.select?.name) colors.push(props.color.select.name.toLowerCase());

          // Image URL
          let rawImgUrl = "";
          const imgProp = props["image url"] || props["Image URL"] || props["Image"] || props["image"];
          if (imgProp?.files?.[0]) {
            rawImgUrl = imgProp.files[0].file?.url || imgProp.files[0].external?.url || "";
          } else if (imgProp?.url) {
            rawImgUrl = imgProp.url;
          }

          const proxiedImgUrl = rawImgUrl ? `${WORKER_URL}?type=image&url=${encodeURIComponent(rawImgUrl)}` : "";

          return {
            id: page.id,
            name: itemName,
            category: cat,
            colors: colors,
            tags: tags,
            url: proxiedImgUrl
          };
        });

        buildTagChips();
        renderCarousels(wardrobeItems);
        drawOutfitCanvas();
      } catch (err) {
        console.error("error fetching notion wardrobe:", err);
      }
    }

    function buildTagChips() {
      const allTags = new Set();
      wardrobeItems.forEach(item => {
        item.colors.forEach(c => allTags.add(c));
        item.tags.forEach(t => allTags.add(t));
      });

      const container = document.getElementById("tag-chips");
      container.innerHTML = Array.from(allTags).map(tag => `
        <div class="filter-chip" onclick="toggleTagFilter('${tag}', this)">${tag}</div>
      `).join('');
    }

    function toggleTagFilter(tag, element) {
      if (activeTags.has(tag)) {
        activeTags.delete(tag);
        element.classList.remove("active");
      } else {
        activeTags.add(tag);
        element.classList.add("active");
      }
      applyFilters();
    }

    function applyFilters() {
      const searchQuery = document.getElementById("search-box").value.toLowerCase().trim();

      const filtered = wardrobeItems.filter(item => {
        const matchesSearch = !searchQuery || 
          item.name.includes(searchQuery) ||
          item.colors.some(c => c.includes(searchQuery)) ||
          item.tags.some(t => t.includes(searchQuery));

        const matchesTags = activeTags.size === 0 || 
          Array.from(activeTags).every(t => item.colors.includes(t) || item.tags.includes(t));

        return matchesSearch && matchesTags;
      });

      renderCarousels(filtered);
    }

    function renderCarousels(items) {
      const categories = ['top', 'bottom', 'shoes', 'outerwear'];

      categories.forEach(cat => {
        const container = document.getElementById(`carousel-${cat}`);
        if (!container) return;

        const catItems = items.filter(i => i.category === cat);

        if (catItems.length === 0) {
          container.innerHTML = `<span style="font-size:0.8rem; color:var(--subtext); padding:8px;">no matching ${cat}s</span>`;
          return;
        }

        container.innerHTML = catItems.map(item => `
          <div class="item-card ${selectedOutfit[cat]?.name === item.name ? 'selected' : ''}" 
               onclick="selectItem('${cat}', '${item.url}', '${item.name}', this)">
            <img src="${item.url}" alt="${item.name}" crossorigin="anonymous" />
            <span>${item.name}</span>
          </div>
        `).join('');
      });
    }

    function selectItem(category, url, name, element) {
      const parent = element.parentElement;
      parent.querySelectorAll('.item-card').forEach(el => el.classList.remove('selected'));
      element.classList.add('selected');

      selectedOutfit[category] = { url, name };
      drawOutfitCanvas();
    }

   async function drawOutfitCanvas() {
  const canvas = document.getElementById('outfit-canvas');
  const ctx = canvas.getContext('2d');
  
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.scale(dpr, dpr);

  ctx.clearRect(0, 0, rect.width, rect.height);
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, rect.width, rect.height);

  // 1. DRAW CUTE PERSON PNG BASE
  await new Promise((resolve) => {
    const personImg = new Image();
    personImg.src = PERSON_IMAGE_URL;
    personImg.onload = () => {
      const personHeight = 310;
      const personWidth = 140;
      const xPos = (rect.width - personWidth) / 2;
      ctx.drawImage(personImg, xPos, 15, personWidth, personHeight);
      resolve();
    };
    personImg.onerror = () => resolve();
  });

  // 2. LAYER CLOTHING
  // Order: bottoms -> tops -> shoes -> outerwear (side-positioned)
  const layers = ['bottom', 'top', 'shoes', 'outerwear'];

  for (const layer of layers) {
    if (selectedOutfit[layer] && selectedOutfit[layer].url) {
      await new Promise((resolve) => {
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.src = selectedOutfit[layer].url;
        img.onload = () => {
          let size = 130;
          let yPos = 50;
          let xPos = (rect.width - size) / 2; // default center alignment

          if (layer === 'top') { 
            size = 135; 
            yPos = 42; // slightly raised top position
          }
          if (layer === 'bottom') { 
            size = 130; 
            yPos = 135; // lowered bottoms so top doesn't cover them
          }
          if (layer === 'shoes') { 
            size = 85; 
            yPos = 235; 
          }
          if (layer === 'outerwear') { 
            size = 130; 
            yPos = 55;
            xPos = rect.width - size - 10; // shifted to the right side of the canvas
          }

          ctx.drawImage(img, xPos, yPos, size, size);
          resolve();
        };
        img.onerror = () => resolve();
      });
    }
  }
}

    function saveOutfit() {
      const canvas = document.getElementById('outfit-canvas');
      const imageDataUrl = canvas.toDataURL('image/png');
      alert("outfit compiled!");
    }

    fetchFromNotion();
  </script>
</body>
</html>
