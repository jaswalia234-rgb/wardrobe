<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Wardrobe & Outfit Picker</title>
  <style>
    :root {
      --bg: #faf7f8;
      --card-bg: rgba(255, 255, 255, 0.75);
      --accent: #e8b4b8;
      --accent-dark: #6b4c57;
      --text: #2d2b2c;
      --radius: 16px;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0; padding: 20px;
      display: flex; flex-direction: column; align-items: center;
    }
    h1 { font-weight: 300; letter-spacing: -0.5px; color: var(--accent-dark); }
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: var(--radius);
      padding: 18px;
      width: 100%; max-width: 420px;
      margin-bottom: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.04);
    }
    .btn {
      background: var(--accent);
      color: white; border: none;
      padding: 12px 20px; border-radius: 20px;
      font-weight: 600; cursor: pointer;
      width: 100%; transition: opacity 0.2s;
    }
    .btn:active { opacity: 0.8; }
    .outfit-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px;
    }
    .item-card {
      background: white; padding: 12px; border-radius: 12px; text-align: center;
      font-size: 0.9rem;
    }
    .tag { font-size: 0.75rem; color: #888; display: block; margin-top: 4px; }
  </style>
</head>
<body>

  <h1>Wardrobe</h1>

  <div class="card">
    <button class="btn" onclick="generateOutfit()">✨ Generate Outfit</button>
    <div class="outfit-grid" id="outfit-display">
      <div class="item-card">Top: --</div>
      <div class="item-card">Bottom: --</div>
      <div class="item-card">Shoes: --</div>
      <div class="item-card">Outerwear: --</div>
    </div>
  </div>

  <div class="card">
    <h3>All Clean Clothes</h3>
    <div id="wardrobe-list">Loading items...</div>
  </div>

  <script>
    const NOTION_KEY = 'YOUR_NOTION_INTEGRATION_TOKEN';
    const DATABASE_ID = 'YOUR_NOTION_DATABASE_ID';

    let wardrobeItems = [];

    async function fetchWardrobe() {
      try {
        const res = await fetch(`https://api.notion.com/v1/databases/${DATABASE_ID}/query`, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${NOTION_KEY}`,
            'Notion-Version': '2022-06-28',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            filter: { property: 'Status', select: { equals: 'Clean' } }
          })
        });
        const data = await res.json();
        wardrobeItems = data.results.map(page => {
          const props = page.properties;
          const lastWashed = props['Last Washed']?.date?.start;
          const daysAgo = lastWashed ? Math.floor((new Date() - new Date(lastWashed)) / (1000 * 60 * 60 * 24)) : 'N/A';
          return {
            id: page.id,
            name: props.Name?.title[0]?.plain_text || 'Unnamed',
            category: props.Category?.select?.name || 'Uncategorized',
            daysAgo: daysAgo
          };
        });
        renderList();
      } catch (err) {
        document.getElementById('wardrobe-list').innerText = 'Failed to load Notion data.';
      }
    }

    function renderList() {
      const listContainer = document.getElementById('wardrobe-list');
      listContainer.innerHTML = wardrobeItems.map(item => `
        <div style="margin-bottom: 8px; border-bottom: 1px solid #eee; padding-bottom: 6px;">
          <strong>${item.name}</strong> (${item.category})
          <span class="tag">Washed ${item.daysAgo} days ago</span>
        </div>
      `).join('');
    }

    function generateOutfit() {
      const getRand = cat => {
        const filtered = wardrobeItems.filter(i => i.category.toLowerCase() === cat.toLowerCase());
        return filtered.length ? filtered[Math.floor(Math.random() * filtered.length)].name : 'None available';
      };

      document.getElementById('outfit-display').innerHTML = `
        <div class="item-card"><strong>Top</strong><br>${getRand('Top')}</div>
        <div class="item-card"><strong>Bottom</strong><br>${getRand('Bottom')}</div>
        <div class="item-card"><strong>Shoes</strong><br>${getRand('Shoes')}</div>
        <div class="item-card"><strong>Outerwear</strong><br>${getRand('Outerwear')}</div>
      `;
    }

    fetchWardrobe();
  </script>
</body>
</html>
