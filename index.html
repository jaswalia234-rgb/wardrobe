<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>wardrobe</title>
  <style>
    :root {
      --bg-color: #fcf6f8;
      --card-bg: rgba(255, 255, 255, 0.75);
      --accent: #f4c2c2;
      --accent-hover: #eaa8a8;
      --text-color: #4a3e3e;
      --subtext: #9e8a8a;
      --radius-lg: 20px;
      --radius-md: 14px;
      --font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-family);
      text-transform: lowercase;
    }

    html, body {
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
      background-color: var(--bg-color);
      color: var(--text-color);
    }

    body {
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 1050px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 500;
      color: var(--text-color);
      letter-spacing: -0.5px;
    }

    .btn-clear-all {
      padding: 8px 14px;
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--text-color);
      border-radius: 20px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-clear-all:hover {
      background: var(--accent);
      color: #ffffff;
    }

    .filter-bar {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: var(--radius-lg);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 4px 15px rgba(244, 194, 194, 0.1);
    }

    .search-row {
      display: flex;
      gap: 10px;
      width: 100%;
      flex-wrap: wrap;
    }

    .search-input {
      flex: 2;
      min-width: 180px;
      padding: 10px 14px;
      border: 1px solid rgba(244, 194, 194, 0.5);
      border-radius: 20px;
      font-size: 0.85rem;
      background: rgba(255, 255, 255, 0.9);
      color: var(--text-color);
      outline: none;
    }

    .search-input::placeholder { color: var(--subtext); }

    .dropdown-select {
      flex: 1;
      min-width: 120px;
      padding: 8px 14px;
      border: 1px solid rgba(244, 194, 194, 0.5);
      border-radius: 20px;
      font-size: 0.8rem;
      background: rgba(255, 255, 255, 0.9);
      color: var(--text-color);
      outline: none;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      text-align: center;
    }

    .tag-filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .filter-chip {
      padding: 6px 14px;
      background: #ffffff;
      border: 1px solid rgba(244, 194, 194, 0.4);
      border-radius: 20px;
      font-size: 0.78rem;
      color: var(--text-color);
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
    }

    .filter-chip.active {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      width: 100%;
    }

    @media (min-width: 768px) {
      .dashboard-grid {
        grid-template-columns: 310px minmax(0, 1fr);
      }
    }

    .preview-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: var(--radius-lg);
      padding: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      box-shadow: 0 10px 25px rgba(244, 194, 194, 0.15);
      position: sticky;
      top: 16px;
      height: fit-content;
    }

    .outfit-display-canvas {
      width: 100%;
      height: 330px;
      background: #ffffff;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 1px solid rgba(244, 194, 194, 0.3);
    }

    .outfit-display-canvas canvas {
      width: 100%;
      height: 100%;
    }

    .controls-panel {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: rgba(255, 255, 255, 0.6);
      padding: 12px 16px;
      border-radius: var(--radius-md);
      border: 1px solid rgba(244, 194, 194, 0.3);
    }

    .control-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: var(--text-color);
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 38px;
      height: 20px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #e0d0d5;
      transition: .2s;
      border-radius: 20px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .2s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: var(--accent);
    }

    input:checked + .slider:before {
      transform: translateX(18px);
    }

    .btn-sync {
      width: 100%;
      padding: 12px;
      background: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-md);
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .btn-sync:hover { background: var(--accent-hover); }
    .btn-sync:disabled { opacity: 0.6; cursor: default; }

    .carousel-section {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
      min-width: 0;
    }

    .category-group {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: var(--radius-lg);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .category-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .category-title {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--subtext);
    }

    .category-filters-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .btn-clear-cat {
      background: none;
      border: none;
      color: var(--subtext);
      font-size: 0.75rem;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 10px;
    }

    .btn-clear-cat:hover {
      background: rgba(244, 194, 194, 0.3);
      color: var(--text-color);
    }

    .carousel-wrapper {
      position: relative;
      width: 100%;
      display: flex;
      align-items: center;
    }

    .carousel {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      padding-bottom: 4px;
      -webkit-overflow-scrolling: touch;
      width: 100%;
      scroll-behavior: smooth;
    }

    .carousel::-webkit-scrollbar { height: 4px; }
    .carousel::-webkit-scrollbar-thumb {
      background: var(--accent);
      border-radius: 4px;
    }

    .carousel-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 28px;
      height: 28px;
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid var(--accent);
      color: var(--text-color);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      transition: all 0.2s ease;
      opacity: 0;
      pointer-events: none;
      font-size: 0.75rem;
    }

    .carousel-arrow.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .carousel-arrow:hover {
      background: var(--accent);
      color: #ffffff;
    }

    .carousel-arrow.left { left: -6px; }
    .carousel-arrow.right { right: -6px; }

    .item-card {
      flex: 0 0 95px;
      height: 105px;
      background: #ffffff;
      border-radius: var(--radius-md);
      padding: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      scroll-snap-align: start;
      border: 2px solid transparent;
      transition: all 0.2s ease;
    }

    .item-card.selected {
      border-color: var(--accent);
      background: #fffafa;
    }

    .item-card.in-wash { opacity: 0.45; }

    .item-card img {
      width: 60px;
      height: 60px;
      object-fit: contain;
    }

    .item-card span {
      font-size: 0.72rem;
      color: var(--text-color);
      margin-top: 4px;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-row">
      <h1>wardrobe</h1>
      <button class="btn-clear-all" onclick="clearAllOutfit()">clear outfit</button>
    </div>

    <!-- Filter Bar -->
    <div class="filter-bar">
      <div class="search-row">
        <input type="text" class="search-input" id="search-box" placeholder="search items..." oninput="debouncedApplyFilters()" />

        <select class="dropdown-select" id="colour-select" onchange="applyFilters()">
          <option value="">all colours</option>
        </select>

        <select class="dropdown-select" id="brand-select" onchange="applyFilters()">
          <option value="">all brands</option>
          <option value="shein">shein</option>
          <option value="primark">primark</option>
          <option value="plt">plt</option>
          <option value="hollister">hollister</option>
          <option value="victoria secret">victoria secret</option>
          <option value="other">other</option>
        </select>

        <select class="dropdown-select" id="fit-select" onchange="applyFilters()">
          <option value="">all fits</option>
          <option value="tight">tight</option>
          <option value="baggy">baggy</option>
        </select>
      </div>

      <div class="tag-filters">
        <div class="filter-chip" onclick="toggleTagFilter('comfy', this)">comfy</div>
        <div class="filter-chip" onclick="toggleTagFilter('winter', this)">winter</div>
        <div class="filter-chip" onclick="toggleTagFilter('loungewear', this)">loungewear</div>
        <div class="filter-chip" onclick="toggleTagFilter('club', this)">club</div>
        <div class="filter-chip" onclick="toggleTagFilter('new', this)">new</div>
        <div class="filter-chip" onclick="toggleTagFilter('matching set', this)">matching set</div>
        <div class="filter-chip" onclick="toggleInWash(this)">in the wash too</div>
        <div id="dynamic-tag-chips" style="display:flex; gap:8px; flex-wrap:wrap;"></div>
      </div>
    </div>

    <div class="dashboard-grid">
      <!-- Preview Canvas & Custom Save Controls -->
      <div class="preview-card">
        <div class="category-title">outfit preview</div>
        <div class="outfit-display-canvas">
          <canvas id="outfit-canvas" width="300" height="330"></canvas>
        </div>

        <div class="controls-panel">
          <div class="control-item">
            <span>date</span>
            <input type="date" id="outfit-date-picker" class="dropdown-select" style="padding: 4px 8px; font-size: 0.8rem;" />
          </div>

          <div class="control-item" style="flex-direction: column; align-items: flex-start; gap: 6px;">
            <span style="font-size: 0.8rem; color: var(--subtext);">outfit name / occasion</span>
            <input type="text" id="outfit-name-input" class="search-input" placeholder="e.g. uni outfit, clubbing, loungewear, pjs" style="width: 100%; padding: 6px 12px; font-size: 0.8rem;" />
            <div style="display: flex; gap: 4px; flex-wrap: wrap; margin-top: 2px;">
              <span class="filter-chip" onclick="quickSetName('uni outfit')" style="padding: 2px 8px; font-size: 0.7rem;">uni outfit</span>
              <span class="filter-chip" onclick="quickSetName('club')" style="padding: 2px 8px; font-size: 0.7rem;">club</span>
              <span class="filter-chip" onclick="quickSetName('loungewear')" style="padding: 2px 8px; font-size: 0.7rem;">loungewear</span>
              <span class="filter-chip" onclick="quickSetName('pjs')" style="padding: 2px 8px; font-size: 0.7rem;">pjs</span>
            </div>
          </div>

          <div class="control-item">
            <span>push-up bra</span>
            <label class="switch">
              <input type="checkbox" id="bra-switch">
              <span class="slider"></span>
            </label>
          </div>
          <div class="control-item">
            <span>tights</span>
            <label class="switch">
              <input type="checkbox" id="tights-switch">
              <span class="slider"></span>
            </label>
          </div>
        </div>

        <button class="btn-sync" onclick="saveOutfit()">save outfit to notion</button>
      </div>

      <div class="carousel-section">
        <!-- TOPS -->
        <div class="category-group">
          <div class="category-header">
            <span class="category-title">tops</span>
            <button class="btn-clear-cat" onclick="clearCategory('top')">clear</button>
          </div>
          <div class="category-filters-row">
            <select class="dropdown-select" id="top-type-select" onchange="applyFilters()">
              <option value="">all top types</option>
              <option value="sweater">sweater</option>
              <option value="hoodie">hoodie</option>
              <option value="shirt">shirt</option>
              <option value="top">top</option>
            </select>
            <select class="dropdown-select" id="top-crop-select" onchange="applyFilters()">
              <option value="">all crops</option>
              <option value="cropped">cropped</option>
              <option value="extra cropped">extra cropped</option>
              <option value="not cropped">not cropped</option>
            </select>
            <select class="dropdown-select" id="top-sleeve-select" onchange="applyFilters()">
              <option value="">all sleeves</option>
              <option value="long-sleeved">long-sleeved</option>
              <option value="short-sleeved">short-sleeved</option>
              <option value="no sleeves">no sleeves</option>
            </select>
            <div class="filter-chip" onclick="toggleTagFilter('booby', this)">booby</div>
          </div>
          <div class="carousel-wrapper">
            <button class="carousel-arrow left" id="arrow-left-top" onclick="scrollCarousel('top', -200)">&#10094;</button>
            <div class="carousel" id="carousel-top" onscroll="checkCarouselArrows('top')"></div>
            <button class="carousel-arrow right" id="arrow-right-top" onclick="scrollCarousel('top', 200)">&#10095;</button>
          </div>
        </div>

        <!-- BOTTOMS -->
        <div class="category-group">
          <div class="category-header">
            <span class="category-title">bottoms</span>
            <button class="btn-clear-cat" onclick="clearCategory('bottom')">clear</button>
          </div>
          <div class="category-filters-row">
            <select class="dropdown-select" id="bottom-type-select" onchange="applyFilters()">
              <option value="">all bottom types</option>
              <option value="joggers">joggers</option>
              <option value="jeans">jeans</option>
              <option value="skirt">skirt</option>
              <option value="shorts">shorts</option>
            </select>
          </div>
          <div class="carousel-wrapper">
            <button class="carousel-arrow left" id="arrow-left-bottom" onclick="scrollCarousel('bottom', -200)">&#10094;</button>
            <div class="carousel" id="carousel-bottom" onscroll="checkCarouselArrows('bottom')"></div>
            <button class="carousel-arrow right" id="arrow-right-bottom" onclick="scrollCarousel('bottom', 200)">&#10095;</button>
          </div>
        </div>

        <!-- DRESSES -->
        <div class="category-group">
          <div class="category-header">
            <span class="category-title">dresses</span>
            <button class="btn-clear-cat" onclick="clearCategory('dresses')">clear</button>
          </div>
          <div class="category-filters-row">
            <select class="dropdown-select" id="dress-length-select" onchange="applyFilters()">
              <option value="">all lengths</option>
              <option value="maxi">maxi</option>
              <option value="mini">mini</option>
              <option value="midi">midi</option>
            </select>
            <select class="dropdown-select" id="dress-sleeve-select" onchange="applyFilters()">
              <option value="">all sleeves</option>
              <option value="long-sleeved">long-sleeved</option>
              <option value="short-sleeved">short-sleeved</option>
              <option value="no sleeves">no sleeves</option>
            </select>
            <div class="filter-chip" onclick="toggleTagFilter('booby', this)">booby</div>
          </div>
          <div class="carousel-wrapper">
            <button class="carousel-arrow left" id="arrow-left-dresses" onclick="scrollCarousel('dresses', -200)">&#10094;</button>
            <div class="carousel" id="carousel-dresses" onscroll="checkCarouselArrows('dresses')"></div>
            <button class="carousel-arrow right" id="arrow-right-dresses" onclick="scrollCarousel('dresses', 200)">&#10095;</button>
          </div>
        </div>

        <!-- SHOES -->
        <div class="category-group">
          <div class="category-header">
            <span class="category-title">shoes</span>
            <button class="btn-clear-cat" onclick="clearCategory('shoes')">clear</button>
          </div>
          <div class="carousel-wrapper">
            <button class="carousel-arrow left" id="arrow-left-shoes" onclick="scrollCarousel('shoes', -200)">&#10094;</button>
            <div class="carousel" id="carousel-shoes" onscroll="checkCarouselArrows('shoes')"></div>
            <button class="carousel-arrow right" id="arrow-right-shoes" onclick="scrollCarousel('shoes', 200)">&#10095;</button>
          </div>
        </div>

        <!-- OUTERWEAR -->
        <div class="category-group">
          <div class="category-header">
            <span class="category-title">outerwear</span>
            <button class="btn-clear-cat" onclick="clearCategory('outerwear')">clear</button>
          </div>
          <div class="carousel-wrapper">
            <button class="carousel-arrow left" id="arrow-left-outerwear" onclick="scrollCarousel('outerwear', -200)">&#10094;</button>
            <div class="carousel" id="carousel-outerwear" onscroll="checkCarouselArrows('outerwear')"></div>
            <button class="carousel-arrow right" id="arrow-right-outerwear" onclick="scrollCarousel('outerwear', 200)">&#10095;</button>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script>
    // your keys are NOT in this page any more: they live in the Cloudflare worker as secrets
    const WORKER_URL = "https://wardrobe-proxy.jaswalia234.workers.dev";
    const PERSON_IMAGE_URL = "images/person.png";

    let wardrobeItems = [];
    let activeTags = new Set();
    let showInWash = false;
    let selectedOutfit = { top: null, bottom: null, dresses: null, shoes: null, outerwear: null };
    let filterDebounceTimer = null;
    let imageCache = {};

    document.addEventListener("DOMContentLoaded", () => {
      const datePicker = document.getElementById('outfit-date-picker');
      if (datePicker) {
        const d = new Date();
        datePicker.value = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
      }
    });

    function quickSetName(name) {
      document.getElementById('outfit-name-input').value = name;
    }

    function getOrdinalSuffix(day) {
      if (day > 3 && day < 21) return 'th';
      switch (day % 10) {
        case 1:  return "st";
        case 2:  return "nd";
        case 3:  return "rd";
        default: return "th";
      }
    }

    function formatCustomDateString(dateObj) {
      const dayName = dateObj.toLocaleDateString('en-GB', { weekday: 'long' }).toLowerCase();
      const monthName = dateObj.toLocaleDateString('en-GB', { month: 'long' }).toLowerCase();
      const dayNum = dateObj.getDate();
      return `${dayName} ${dayNum}${getOrdinalSuffix(dayNum)} ${monthName}`;
    }

    function getColorWeight(colorName) {
      const c = colorName.toLowerCase();
      if (c.includes('white') || c.includes('cream') || c.includes('ivory') || c.includes('nude')) return 10;
      if (c.includes('pink') || c.includes('rose') || c.includes('blush')) return 20;
      if (c.includes('red') || c.includes('burgundy') || c.includes('maroon') || c.includes('wine')) return 30;
      if (c.includes('orange') || c.includes('rust') || c.includes('peach')) return 40;
      if (c.includes('yellow') || c.includes('gold') || c.includes('mustard')) return 50;
      if (c.includes('sage') || c.includes('mint') || c.includes('light green')) return 60;
      if (c.includes('green') || c.includes('khaki') || c.includes('olive') || c.includes('emerald') || c.includes('dark green')) return 70;
      if (c.includes('light blue') || c.includes('sky') || c.includes('baby blue')) return 80;
      if (c.includes('blue') || c.includes('denim') || c.includes('cobalt') || c.includes('royal')) return 85;
      if (c.includes('navy') || c.includes('dark blue')) return 88;
      if (c.includes('lilac') || c.includes('lavender') || c.includes('purple') || c.includes('violet') || c.includes('plum')) return 90;
      if (c.includes('beige') || c.includes('tan') || c.includes('camel') || c.includes('brown') || c.includes('chocolate')) return 100;
      if (c.includes('light grey') || c.includes('silver')) return 110;
      if (c.includes('grey') || c.includes('gray') || c.includes('charcoal')) return 115;
      if (c.includes('black')) return 120;
      return 200;
    }

    // one jumper saved as both "top" and "outerwear" becomes ONE item that shows in both rows
    function tidyItems(items) {
      const byName = {};
      const out = [];
      items.forEach((it) => {
        const key = it.name;
        if (byName[key] && ((byName[key].category === 'top' && it.category === 'outerwear') || (byName[key].category === 'outerwear' && it.category === 'top'))) {
          const keep = byName[key].category === 'top' ? byName[key] : it;
          const other = keep === it ? byName[key] : it;
          keep.layer = true;
          if (!keep.url) keep.url = other.url;
          if (keep !== byName[key]) { out[out.indexOf(byName[key])] = keep; byName[key] = keep; }
          return;
        }
        if (it.tags.includes('layer') || it.tags.includes('can layer')) it.layer = true;
        byName[key] = it;
        out.push(it);
      });
      return out;
    }

    const inWash = (it) => /dirty|wash|laundry|worn/.test(it.status || "");

    function showEverything() {
      populateColourDropdown();
      buildDynamicTagChips();
      applyFilters();
      drawOutfitCanvas();
    }

    async function fetchFromNotion() {
      // 1. instant load from the last time
      const cachedData = localStorage.getItem('cached_wardrobe_items_v2');
      if (cachedData) {
        try {
          wardrobeItems = JSON.parse(cachedData);
          showEverything();
          preloadInitialImages();
        } catch (e) { console.error("cache read error", e); }
      }
      // 2. fresh from Notion (through the worker, which holds the key)
      try {
        const response = await fetch(`${WORKER_URL}/wardrobe`);
        const data = await response.json();
        if (!response.ok || !Array.isArray(data)) { console.error("wardrobe error:", data); return; }
        wardrobeItems = tidyItems(data);
        localStorage.setItem('cached_wardrobe_items_v2', JSON.stringify(wardrobeItems));
        localStorage.removeItem('cached_wardrobe_items');
        showEverything();
      } catch (err) {
        console.error("error fetching wardrobe:", err);
      }
    }

    function preloadInitialImages() {
      ['top', 'bottom', 'dresses', 'shoes', 'outerwear'].forEach(cat => {
        wardrobeItems.filter(i => i.category === cat).slice(0, 3).forEach(item => { if (item.url) loadImage(item.url); });
      });
    }

    function populateColourDropdown() {
      const allColours = new Set();
      wardrobeItems.forEach(item => item.colors.forEach(c => allColours.add(c)));
      const sortedColours = Array.from(allColours).sort((a, b) => {
        const wa = getColorWeight(a), wb = getColorWeight(b);
        return wa === wb ? a.localeCompare(b) : wa - wb;
      });
      const select = document.getElementById("colour-select");
      const current = select.value;
      select.innerHTML = '<option value="">all colours</option>' + sortedColours.map(c => `<option value="${c}">${c}</option>`).join('');
      select.value = current;
    }

    function buildDynamicTagChips() {
      const excludedOptionTags = new Set([
        'comfy', 'winter', 'loungewear', 'club', 'new', 'matching set', 'booby', 'layer', 'can layer',
        'shein', 'primark', 'plt', 'hollister', 'victoria secret', 'other',
        'tight', 'baggy', 'maxi', 'mini', 'midi', 'cropped', 'extra cropped', 'not cropped',
        'long-sleeved', 'short-sleeved', 'no sleeves', 'sweater', 'hoodie', 'shirt', 'top',
        'joggers', 'jeans', 'skirt', 'shorts'
      ]);
      const dynamicTags = new Set();
      wardrobeItems.forEach(item => item.tags.forEach(t => { if (!excludedOptionTags.has(t)) dynamicTags.add(t); }));
      document.getElementById("dynamic-tag-chips").innerHTML = Array.from(dynamicTags).map(tag => `
        <div class="filter-chip${activeTags.has(tag) ? ' active' : ''}" onclick="toggleTagFilter('${tag}', this)">${tag}</div>
      `).join('');
    }

    function toggleTagFilter(tag, element) {
      if (activeTags.has(tag)) { activeTags.delete(tag); element.classList.remove("active"); }
      else { activeTags.add(tag); element.classList.add("active"); }
      applyFilters();
    }

    function toggleInWash(element) {
      showInWash = !showInWash;
      element.classList.toggle("active", showInWash);
      applyFilters();
    }

    function debouncedApplyFilters() {
      clearTimeout(filterDebounceTimer);
      filterDebounceTimer = setTimeout(applyFilters, 100);
    }

    function applyFilters() {
      const v = (id) => document.getElementById(id).value.toLowerCase();
      const searchQuery = v("search-box").trim(), selectedColour = v("colour-select"), selectedBrand = v("brand-select"), selectedFit = v("fit-select");
      const topType = v("top-type-select"), topCrop = v("top-crop-select"), topSleeve = v("top-sleeve-select");
      const bottomType = v("bottom-type-select"), dressLength = v("dress-length-select"), dressSleeve = v("dress-sleeve-select");
      const knownBrands = ['shein', 'primark', 'plt', 'hollister', 'victoria secret'];

      const filtered = wardrobeItems.filter(item => {
        if (!showInWash && inWash(item)) return false;
        const matchesSearch = !searchQuery || item.name.includes(searchQuery);
        const matchesColour = !selectedColour || item.colors.includes(selectedColour);
        let matchesBrand = true;
        if (selectedBrand) matchesBrand = selectedBrand === 'other' ? !item.tags.some(t => knownBrands.includes(t)) : item.tags.includes(selectedBrand);
        const matchesFit = !selectedFit || item.tags.includes(selectedFit);
        const matchesTags = activeTags.size === 0 || Array.from(activeTags).every(t => item.tags.includes(t));
        let ok = true;
        if (item.category === 'top') {
          if (topType && !item.tags.includes(topType)) ok = false;
          if (topCrop && !item.tags.includes(topCrop)) ok = false;
          if (topSleeve && !item.tags.includes(topSleeve)) ok = false;
        } else if (item.category === 'bottom') {
          if (bottomType && !item.tags.includes(bottomType)) ok = false;
        } else if (item.category === 'dresses') {
          if (dressLength && !item.tags.includes(dressLength)) ok = false;
          if (dressSleeve && !item.tags.includes(dressSleeve)) ok = false;
        }
        return matchesSearch && matchesColour && matchesBrand && matchesFit && matchesTags && ok;
      });
      renderCarousels(filtered);
    }

    const NICE = { top: "tops", bottom: "bottoms", dresses: "dresses", shoes: "shoes", outerwear: "outerwear" };
    function renderCarousels(items) {
      ['top', 'bottom', 'dresses', 'shoes', 'outerwear'].forEach(cat => {
        const container = document.getElementById(`carousel-${cat}`);
        if (!container) return;
        // jumpers that can be worn as a layer show up under outerwear too
        const catItems = items.filter(i => i.category === cat || (cat === 'outerwear' && i.layer));
        if (catItems.length === 0) {
          container.innerHTML = `<span style="font-size:0.75rem; color:var(--subtext); padding:6px;">no matching ${NICE[cat]}</span>`;
        } else {
          container.innerHTML = catItems.map(item => `
            <div class="item-card ${selectedOutfit[cat]?.id === item.id ? 'selected' : ''}${inWash(item) ? ' in-wash' : ''}"
                 onclick="selectItem('${cat}', '${item.id}', this)">
              <img src="${item.url}" alt="${item.name}" loading="lazy" decoding="async" crossorigin="anonymous" />
              <span>${item.name}</span>
            </div>
          `).join('');
        }
        setTimeout(() => checkCarouselArrows(cat), 30);
      });
    }

    function scrollCarousel(cat, offset) {
      const container = document.getElementById(`carousel-${cat}`);
      if (container) container.scrollBy({ left: offset, behavior: 'smooth' });
    }

    function checkCarouselArrows(cat) {
      const container = document.getElementById(`carousel-${cat}`);
      const leftArrow = document.getElementById(`arrow-left-${cat}`);
      const rightArrow = document.getElementById(`arrow-right-${cat}`);
      if (!container || !leftArrow || !rightArrow) return;
      const maxScroll = container.scrollWidth - container.clientWidth;
      leftArrow.classList.toggle("visible", container.scrollLeft > 5);
      rightArrow.classList.toggle("visible", container.scrollLeft < maxScroll - 5 && maxScroll > 0);
    }

    function selectItem(category, itemId) {
      const item = wardrobeItems.find(i => i.id === itemId);
      if (!item) return;
      // tapping the selected item again takes it off
      if (selectedOutfit[category]?.id === itemId) { selectedOutfit[category] = null; applyFilters(); drawOutfitCanvas(); return; }
      if (category === 'dresses') { selectedOutfit.top = null; selectedOutfit.bottom = null; }
      else if (category === 'top' || category === 'bottom') selectedOutfit.dresses = null;
      // the same jumper can't be the top and the layer at once
      if (category === 'outerwear' && selectedOutfit.top?.id === itemId) selectedOutfit.top = null;
      if (category === 'top' && selectedOutfit.outerwear?.id === itemId) selectedOutfit.outerwear = null;
      selectedOutfit[category] = item;
      applyFilters();
      drawOutfitCanvas();
    }

    function clearCategory(category) { selectedOutfit[category] = null; applyFilters(); drawOutfitCanvas(); }

    function clearAllOutfit() {
      selectedOutfit = { top: null, bottom: null, dresses: null, shoes: null, outerwear: null };
      applyFilters();
      drawOutfitCanvas();
    }

    function loadImage(url) {
      if (imageCache[url]) return Promise.resolve(imageCache[url]);
      return new Promise((resolve) => {
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.src = url;
        img.onload = () => { imageCache[url] = img; resolve(img); };
        img.onerror = () => resolve(null);
      });
    }

    async function drawOutfitCanvas() {
      const canvas = document.getElementById('outfit-canvas');
      const ctx = canvas.getContext('2d');
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, rect.width, rect.height);

      const personImg = await loadImage(PERSON_IMAGE_URL);
      if (personImg) ctx.drawImage(personImg, (rect.width - 140) / 2, 10, 140, 310);

      const layers = ['dresses', 'bottom', 'top', 'shoes', 'outerwear'];
      const active = layers.filter(layer => selectedOutfit[layer] && selectedOutfit[layer].url);
      const loaded = await Promise.all(active.map(layer => loadImage(selectedOutfit[layer].url).then(img => ({ layer, img }))));
      const SPOT = {
        dresses: [120, 210, 42, null],
        top: [110, 110, 45, null],
        bottom: [145, 145, 148, null],
        shoes: [80, 80, 245, null],
        outerwear: [120, 120, 55, "right"]
      };
      loaded.forEach(({ layer, img }) => {
        if (!img) return;
        const [w, h, y, side] = SPOT[layer];
        const x = side === "right" ? rect.width - w - 10 : (rect.width - w) / 2;
        ctx.drawImage(img, x, y, w, h);
      });
    }

    async function saveOutfit() {
      const btn = document.querySelector('.btn-sync');
      const canvas = document.getElementById('outfit-canvas');
      const customDateVal = document.getElementById('outfit-date-picker').value;
      const [year, month, day] = customDateVal.split('-');
      const pageTitle = `${formatCustomDateString(new Date(year, month - 1, day))} - ${document.getElementById('outfit-name-input').value.trim().toLowerCase() || "outfit"}`;
      const items = Object.values(selectedOutfit).filter(i => i && i.id).map(i => i.id);
      if (!items.length) { alert("pick at least one thing first"); return; }

      btn.disabled = true; btn.textContent = "saving…";
      try {
        const response = await fetch(`${WORKER_URL}/save-outfit`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            title: pageTitle,
            date: customDateVal,
            items: Array.from(new Set(items)),
            bra: document.getElementById('bra-switch').checked ? 'yes' : 'no',
            tights: document.getElementById('tights-switch').checked ? 'yes' : 'no',
            imageBase64: canvas.toDataURL('image/png')
          })
        });
        const resData = await response.json();
        if (response.ok) alert(`saved as "${pageTitle}" to notion!`);
        else { console.error("save error:", resData); alert(`couldn't save: ${resData.message || 'check console'}`); }
      } catch (err) {
        console.error("error saving:", err);
        alert("network error saving to notion.");
      } finally {
        btn.disabled = false; btn.textContent = "save outfit to notion";
      }
    }

    fetchFromNotion();
  </script>
</body>
</html>
