<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>wardrobe</title>
  <style>
    :root {
      --bg-color: #fcf6f8;
      --card-bg: rgba(255, 255, 255, 0.75);
      --accent: #f4c2c2;
      --accent-hover: #eaa8a8;
      --text-color: #4a3e3e;
      --subtext: #9e8a8a;
      --radius-lg: 20px;
      --radius-md: 14px;
      --font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-family);
      text-transform: lowercase;
    }

    html, body {
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
      background-color: var(--bg-color);
      color: var(--text-color);
    }

    body {
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 1000px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 500;
      color: var(--text-color);
      letter-spacing: -0.5px;
    }

    .btn-clear-all {
      padding: 8px 14px;
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--text-color);
      border-radius: 20px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-clear-all:hover {
      background: var(--accent);
      color: #ffffff;
    }

    /* search and filters */
    .filter-bar {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: var(--radius-lg);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 4px 15px rgba(244, 194, 194, 0.1);
    }

    .search-row {
      display: flex;
      gap: 10px;
      width: 100%;
    }

    .search-input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid rgba(244, 194, 194, 0.5);
      border-radius: var(--radius-md);
      font-size: 0.9rem;
      background: rgba(255, 255, 255, 0.9);
      color: var(--text-color);
      outline: none;
    }

    .search-input::placeholder { color: var(--subtext); }

    .colour-select {
      padding: 10px 14px;
      border: 1px solid rgba(244, 194, 194, 0.5);
      border-radius: var(--radius-md);
      font-size: 0.85rem;
      background: rgba(255, 255, 255, 0.9);
      color: var(--text-color);
      outline: none;
      cursor: pointer;
    }

    .tag-filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-chip {
      padding: 5px 12px;
      background: #ffffff;
      border: 1px solid rgba(244, 194, 194, 0.4);
      border-radius: 20px;
      font-size: 0.78rem;
      color: var(--text-color);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .filter-chip.active {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      width: 100%;
    }

    @media (min-width: 768px) {
      .dashboard-grid {
        grid-template-columns: 310px minmax(0, 1fr);
      }
    }

    .preview-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: var(--radius-lg);
      padding: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      box-shadow: 0 10px 25px rgba(244, 194, 194, 0.15);
      position: sticky;
      top: 16px;
      height: fit-content;
    }

    .outfit-display-canvas {
      width: 100%;
      height: 330px;
      background: #ffffff;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 1px solid rgba(244, 194, 194, 0.3);
    }

    .outfit-display-canvas canvas {
      width: 100%;
      height: 100%;
    }

    .controls-panel {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: rgba(255, 255, 255, 0.6);
      padding: 12px 16px;
      border-radius: var(--radius-md);
      border: 1px solid rgba(244, 194, 194, 0.3);
    }

    .control-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: var(--text-color);
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 38px;
      height: 20px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #e0d0d5;
      transition: .2s;
      border-radius: 20px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .2s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: var(--accent);
    }

    input:checked + .slider:before {
      transform: translateX(18px);
    }

    .btn-sync {
      width: 100%;
      padding: 12px;
      background: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-md);
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .btn-sync:hover { background: var(--accent-hover); }

    .carousel-section {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
      min-width: 0;
    }

    .category-group {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: var(--radius-lg);
      padding: 14px;
    }

    .category-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .category-title {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--subtext);
    }

    .btn-clear-cat {
      background: none;
      border: none;
      color: var(--subtext);
      font-size: 0.75rem;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 10px;
    }

    .btn-clear-cat:hover {
      background: rgba(244, 194, 194, 0.3);
      color: var(--text-color);
    }

    .carousel {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      padding-bottom: 4px;
      -webkit-overflow-scrolling: touch;
      width: 100%;
    }

    .carousel::-webkit-scrollbar { height: 4px; }
    .carousel::-webkit-scrollbar-thumb {
      background: var(--accent);
      border-radius: 4px;
    }

    .item-card {
      flex: 0 0 95px;
      height: 105px;
      background: #ffffff;
      border-radius: var(--radius-md);
      padding: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      scroll-snap-align: start;
      border: 2px solid transparent;
      transition: all 0.2s ease;
    }

    .item-card.selected {
      border-color: var(--accent);
      background: #fffafa;
    }

    .item-card img {
      width: 60px;
      height: 60px;
      object-fit: contain;
    }

    .item-card span {
      font-size: 0.72rem;
      color: var(--text-color);
      margin-top: 4px;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <div class="header-row">
      <h1>wardrobe</h1>
      <button class="btn-clear-all" onclick="clearAllOutfit()">clear outfit</button>
    </div>

    <!-- search & filter bar -->
    <div class="filter-bar">
      <div class="search-row">
        <input type="text" class="search-input" id="search-box" placeholder="search items..." oninput="applyFilters()" />
        <select class="colour-select" id="colour-select" onchange="applyFilters()">
          <option value="">all colours</option>
        </select>
      </div>
      <div class="tag-filters" id="tag-chips"></div>
    </div>

    <div class="dashboard-grid">
      
      <!-- preview canvas -->
      <div class="preview-card">
        <div class="category-title">tomorrow's outfit</div>
        <div class="outfit-display-canvas">
          <canvas id="outfit-canvas" width="300" height="330"></canvas>
        </div>

        <div class="controls-panel">
          <div class="control-item">
            <span>push-up bra</span>
            <label class="switch">
              <input type="checkbox" id="bra-switch">
              <span class="slider"></span>
            </label>
          </div>
          <div class="control-item">
            <span>tights</span>
            <label class="switch">
              <input type="checkbox" id="tights-switch">
              <span class="slider"></span>
            </label>
          </div>
        </div>

        <button class="btn-sync" onclick="saveOutfit()">save outfit to notion</button>
      </div>

      <!-- category carousels -->
      <div class="carousel-section">
        
        <div class="category-group">
          <div class="category-header">
            <span class="category-title">tops</span>
            <button class="btn-clear-cat" onclick="clearCategory('top')">clear</button>
          </div>
          <div class="carousel" id="carousel-top"></div>
        </div>

        <div class="category-group">
          <div class="category-header">
            <span class="category-title">bottoms</span>
            <button class="btn-clear-cat" onclick="clearCategory('bottom')">clear</button>
          </div>
          <div class="carousel" id="carousel-bottom"></div>
        </div>

        <div class="category-group">
          <div class="category-header">
            <span class="category-title">dresses</span>
            <button class="btn-clear-cat" onclick="clearCategory('dresses')">clear</button>
          </div>
          <div class="carousel" id="carousel-dresses"></div>
        </div>

        <div class="category-group">
          <div class="category-header">
            <span class="category-title">shoes</span>
            <button class="btn-clear-cat" onclick="clearCategory('shoes')">clear</button>
          </div>
          <div class="carousel" id="carousel-shoes"></div>
        </div>

        <div class="category-group">
          <div class="category-header">
            <span class="category-title">outerwear</span>
            <button class="btn-clear-cat" onclick="clearCategory('outerwear')">clear</button>
          </div>
          <div class="carousel" id="carousel-outerwear"></div>
        </div>

      </div>

    </div>
  </div>

  <script>
    const WORKER_URL = "https://wardrobe-proxy.jaswalia234.workers.dev";
    const NOTION_TOKEN = "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";
    const WARDROBE_DB_ID = "40eaedaf73e8806dbddfdef92af3548e";

    const PERSON_IMAGE_URL = "images/person.png";

    let wardrobeItems = [];
    let activeTags = new Set();
    let selectedOutfit = { top: null, bottom: null, dresses: null, shoes: null, outerwear: null };

    async function fetchFromNotion() {
      const notionEndpoint = `https://api.notion.com/v1/databases/${WARDROBE_DB_ID}/query`;
      const proxiedUrl = `${WORKER_URL}?url=${encodeURIComponent(notionEndpoint)}`;

      try {
        const response = await fetch(proxiedUrl, {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${NOTION_TOKEN}`,
            "Notion-Version": "2022-06-28",
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            filter: { property: "status", select: { equals: "clean" } }
          })
        });

        const data = await response.json();
        if (!data.results) return;

        wardrobeItems = data.results.map(page => {
          const props = page.properties;

          const titleObj = props.name || props.Name || props.Title;
          const itemName = titleObj?.title?.[0]?.plain_text?.toLowerCase() || "unnamed";

          let cat = props.category?.select?.name?.toLowerCase() || "top";
          if (cat === "bottoms") cat = "bottom";
          if (cat === "dress") cat = "dresses";

          // Extract Colour/Color property dynamically
          const colourProp = props.colour || props.Colour || props.color || props.Color;
          const colors = [];
          if (colourProp?.multi_select) {
            colourProp.multi_select.forEach(c => colors.push(c.name.toLowerCase()));
          } else if (colourProp?.select?.name) {
            colors.push(colourProp.select.name.toLowerCase());
          } else if (colourProp?.rich_text?.[0]?.plain_text) {
            colors.push(colourProp.rich_text[0].plain_text.toLowerCase());
          }

          // Extract Tags
          const tagsProp = props.tags || props.Tags;
          const tags = tagsProp?.multi_select?.map(t => t.name.toLowerCase()) || [];

          let rawImgUrl = "";
          const imgProp = props["image url"] || props["Image URL"] || props["Image"] || props["image"];
          if (imgProp?.files?.[0]) {
            rawImgUrl = imgProp.files[0].file?.url || imgProp.files[0].external?.url || "";
          } else if (imgProp?.url) {
            rawImgUrl = imgProp.url;
          }

          const proxiedImgUrl = rawImgUrl ? `${WORKER_URL}?type=image&url=${encodeURIComponent(rawImgUrl)}` : "";

          return {
            id: page.id,
            name: itemName,
            category: cat,
            colors: colors,
            tags: tags,
            url: proxiedImgUrl
          };
        });

        populateColourDropdown();
        buildTagChips();
        renderCarousels(wardrobeItems);
        drawOutfitCanvas();
      } catch (err) {
        console.error("error fetching notion wardrobe:", err);
      }
    }

    function populateColourDropdown() {
      const allColours = new Set();
      wardrobeItems.forEach(item => {
        item.colors.forEach(c => allColours.add(c));
      });

      const select = document.getElementById("colour-select");
      select.innerHTML = '<option value="">all colours</option>' + 
        Array.from(allColours).map(c => `<option value="${c}">${c}</option>`).join('');
    }

    function buildTagChips() {
      const allTags = new Set();
      wardrobeItems.forEach(item => {
        item.tags.forEach(t => allTags.add(t));
      });

      const container = document.getElementById("tag-chips");
      container.innerHTML = Array.from(allTags).map(tag => `
        <div class="filter-chip" onclick="toggleTagFilter('${tag}', this)">${tag}</div>
      `).join('');
    }

    function toggleTagFilter(tag, element) {
      if (activeTags.has(tag)) {
        activeTags.delete(tag);
        element.classList.remove("active");
      } else {
        activeTags.add(tag);
        element.classList.add("active");
      }
      applyFilters();
    }

    function applyFilters() {
      const searchQuery = document.getElementById("search-box").value.toLowerCase().trim();
      const selectedColour = document.getElementById("colour-select").value.toLowerCase();

      const filtered = wardrobeItems.filter(item => {
        const matchesSearch = !searchQuery || item.name.includes(searchQuery);
        const matchesColour = !selectedColour || item.colors.includes(selectedColour);
        const matchesTags = activeTags.size === 0 || Array.from(activeTags).every(t => item.tags.includes(t));

        return matchesSearch && matchesColour && matchesTags;
      });

      renderCarousels(filtered);
    }

    function renderCarousels(items) {
      const categories = ['top', 'bottom', 'dresses', 'shoes', 'outerwear'];

      categories.forEach(cat => {
        const container = document.getElementById(`carousel-${cat}`);
        if (!container) return;

        const catItems = items.filter(i => i.category === cat);

        if (catItems.length === 0) {
          container.innerHTML = `<span style="font-size:0.75rem; color:var(--subtext); padding:6px;">no matching ${cat}s</span>`;
          return;
        }

        container.innerHTML = catItems.map(item => `
          <div class="item-card ${selectedOutfit[cat]?.name === item.name ? 'selected' : ''}" 
               onclick="selectItem('${cat}', '${item.url}', '${item.name}', this)">
            <img src="${item.url}" alt="${item.name}" crossorigin="anonymous" />
            <span>${item.name}</span>
          </div>
        `).join('');
      });
    }

    function selectItem(category, url, name, element) {
      if (category === 'dresses') {
        selectedOutfit.top = null;
        selectedOutfit.bottom = null;
      } else if (category === 'top' || category === 'bottom') {
        selectedOutfit.dresses = null;
      }

      selectedOutfit[category] = { url, name };

      applyFilters();
      drawOutfitCanvas();
    }

    function clearCategory(category) {
      selectedOutfit[category] = null;
      applyFilters();
      drawOutfitCanvas();
    }

    function clearAllOutfit() {
      selectedOutfit = { top: null, bottom: null, dresses: null, shoes: null, outerwear: null };
      applyFilters();
      drawOutfitCanvas();
    }

    async function drawOutfitCanvas() {
      const canvas = document.getElementById('outfit-canvas');
      const ctx = canvas.getContext('2d');
      
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);

      ctx.clearRect(0, 0, rect.width, rect.height);
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, rect.width, rect.height);

      // 1. DRAW PERSON PNG BASE (CENTERED)
      await new Promise((resolve) => {
        const personImg = new Image();
        personImg.src = PERSON_IMAGE_URL;
        personImg.onload = () => {
          const personHeight = 310;
          const personWidth = 140;
          const xPos = (rect.width - personWidth) / 2;
          ctx.drawImage(personImg, xPos, 10, personWidth, personHeight);
          resolve();
        };
        personImg.onerror = () => resolve();
      });

      // 2. LAYER CLOTHING
      const layers = ['dresses', 'bottom', 'top', 'shoes', 'outerwear'];

      for (const layer of layers) {
        if (selectedOutfit[layer] && selectedOutfit[layer].url) {
          await new Promise((resolve) => {
            const img = new Image();
            img.crossOrigin = "anonymous";
            img.src = selectedOutfit[layer].url;
            img.onload = () => {
              let size = 110;
              let yPos = 45;
              let xPos = (rect.width - size) / 2;

              if (layer === 'dresses') {
                size = 140;
                yPos = 45;
                xPos = (rect.width - size) / 2;
              }
              if (layer === 'top') { 
                size = 110; 
                yPos = 45; 
                xPos = (rect.width - size) / 2;
              }
              if (layer === 'bottom') { 
                size = 145; 
                yPos = 148; 
                xPos = (rect.width - size) / 2;
              }
              if (layer === 'shoes') { 
                size = 80; 
                yPos = 245; 
                xPos = (rect.width - size) / 2;
              }
              if (layer === 'outerwear') { 
                size = 120; 
                yPos = 55;
                xPos = rect.width - size - 10;
              }

              ctx.drawImage(img, xPos, yPos, size, size);
              resolve();
            };
            img.onerror = () => resolve();
          });
        }
      }
    }

    function saveOutfit() {
      const canvas = document.getElementById('outfit-canvas');
      const imageDataUrl = canvas.toDataURL('image/png');

      const payload = {
        image: imageDataUrl,
        items: selectedOutfit,
        bra: document.getElementById('bra-switch').checked,
        tights: document.getElementById('tights-switch').checked
      };

      console.log("Outfit payload ready for Notion:", payload);
      alert("outfit saved with switches!");
    }

    fetchFromNotion();
  </script>
</body>
</html>
