<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wardrobe & Outfit Picker</title>
  <style>
    :root {
      --bg-color: #fbeef1;
      --card-bg: rgba(255, 255, 255, 0.7);
      --card-border: rgba(255, 255, 255, 0.9);
      --text-color: #4a3e3d;
      --accent-btn: #e8a5b8;
      --accent-btn-hover: #d992a6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 20px 16px;
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      font-weight: 400;
      font-size: 1.8rem;
      margin-bottom: 24px;
      letter-spacing: -0.5px;
    }

    #loading {
      text-align: center;
      padding: 40px;
      font-size: 1rem;
      opacity: 0.7;
    }

    .category-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin: 24px 0 12px 4px;
      text-transform: capitalize;
      letter-spacing: -0.3px;
    }

    .carousel {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      padding-bottom: 12px;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
    }

    .carousel::-webkit-scrollbar {
      height: 6px;
    }

    .carousel::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.1);
      border-radius: 10px;
    }

    .card {
      flex: 0 0 200px;
      scroll-snap-align: start;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.03);
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.2s ease;
    }

    .card:active {
      transform: scale(0.98);
    }

    .card img {
      width: 100%;
      height: 170px;
      object-fit: cover;
      border-radius: 12px;
      background-color: #ffffff;
      margin-bottom: 10px;
    }

    .no-img {
      width: 100%;
      height: 170px;
      border-radius: 12px;
      background-color: rgba(255, 255, 255, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      opacity: 0.5;
      margin-bottom: 10px;
    }

    .card-title {
      font-weight: 600;
      font-size: 0.95rem;
      margin-bottom: 6px;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }

    .tag {
      font-size: 0.72rem;
      padding: 4px 10px;
      border-radius: 20px;
      margin-bottom: 12px;
      font-weight: 500;
      text-align: center;
    }

    .tag-fresh { background-color: #d4edda; color: #155724; }
    .tag-warn  { background-color: #fff3cd; color: #856404; }
    .tag-wash  { background-color: #f8d7da; color: #721c24; }

    button {
      width: 100%;
      padding: 9px 0;
      border: none;
      border-radius: 12px;
      background-color: var(--accent-btn);
      color: #ffffff;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, opacity 0.2s;
    }

    button:hover { background-color: var(--accent-btn-hover); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>

  <h1>Wardrobe Selector</h1>
  <div id="loading">Loading your closet...</div>
  <div id="app"></div>

  <script>
    // CONFIGURATION: Replace with your actual credentials
const NOTION_API_KEY = "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";
const DATABASE_ID = "40eaedaf73e8806dbddfdef92af3548e";

async function fetchWardrobe() {
  const loadingEl = document.getElementById("loading");
  const targetUrl = `https://api.notion.com/v1/databases/${DATABASE_ID}/query`;
  
  // Alternative free CORS proxy wrapper
  const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`;

  try {
    const response = await fetch(proxyUrl, {
      method: "POST",
      headers: {
        "Authorization": `Bearer ${NOTION_API_KEY}`,
        "Notion-Version": "2022-06-28",
        "Content-Type": "application/json"
      }
    });

    if (!response.ok) {
      const errBody = await response.text();
      throw new Error(`HTTP ${response.status}: ${errBody}`);
    }

    const data = await response.json();
    loadingEl.style.display = "none";
    renderWardrobe(data.results);
  } catch (err) {
    loadingEl.innerText = `Error loading closet: ${err.message}`;
    console.error(err);
  }
}
  </script>
</body>
</html>
