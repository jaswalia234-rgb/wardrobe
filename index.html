<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>wardrobe</title>
  <style>
    :root {
      --bg-color: #fcf6f8;
      --card-bg: rgba(255, 255, 255, 0.7);
      --accent: #f4c2c2;
      --accent-hover: #eaa8a8;
      --text-color: #4a3e3e;
      --subtext: #9e8a8a;
      --radius-lg: 20px;
      --radius-md: 14px;
      --font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-family);
      text-transform: lowercase;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 500;
      color: var(--text-color);
      letter-spacing: -0.5px;
      margin-bottom: 4px;
    }

    /* main layout grid */
    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    @media (min-width: 768px) {
      .dashboard-grid {
        grid-template-columns: 320px 1fr;
      }
    }

    /* preview card */
    .preview-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: var(--radius-lg);
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      box-shadow: 0 10px 25px rgba(244, 194, 194, 0.15);
      position: sticky;
      top: 20px;
      height: fit-content;
    }

    .outfit-display-canvas {
      width: 100%;
      height: 320px;
      background: #ffffff;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(244, 194, 194, 0.3);
    }

    .outfit-display-canvas img {
      position: absolute;
      max-width: 80%;
      max-height: 80%;
      object-fit: contain;
      transition: all 0.3s ease;
    }

    .btn-sync {
      width: 100%;
      padding: 12px 18px;
      background: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-md);
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    .btn-sync:hover {
      background: var(--accent-hover);
    }

    .btn-sync:active {
      transform: scale(0.98);
    }

    /* category carousels */
    .carousel-section {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .category-group {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: var(--radius-lg);
      padding: 16px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.02);
    }

    .category-title {
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--subtext);
      margin-bottom: 12px;
    }

    .carousel {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      padding-bottom: 6px;
      -webkit-overflow-scrolling: touch;
    }

    .carousel::-webkit-scrollbar {
      height: 4px;
    }

    .carousel::-webkit-scrollbar-thumb {
      background: var(--accent);
      border-radius: 4px;
    }

    .item-card {
      flex: 0 0 100px;
      height: 110px;
      background: #ffffff;
      border-radius: var(--radius-md);
      padding: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      scroll-snap-align: start;
      border: 2px solid transparent;
      transition: all 0.2s ease;
    }

    .item-card.selected {
      border-color: var(--accent);
      background: #fffafa;
    }

    .item-card img {
      width: 65px;
      height: 65px;
      object-fit: contain;
    }

    .item-card span {
      font-size: 0.75rem;
      color: var(--text-color);
      margin-top: 6px;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>wardrobe</h1>

    <div class="dashboard-grid">
      
      <!-- selected outfit preview -->
      <div class="preview-card">
        <div class="category-title">tomorrow's outfit</div>
        <div class="outfit-display-canvas" id="canvas-container">
          <canvas id="outfit-canvas" width="300" height="320"></canvas>
        </div>
        <button class="btn-sync" onclick="syncOutfitToNotion()">save outfit to notion</button>
      </div>

      <!-- category carousels -->
      <div class="carousel-section">
        
        <div class="category-group">
          <div class="category-title">tops</div>
          <div class="carousel" id="carousel-top"></div>
        </div>

        <div class="category-group">
          <div class="category-title">bottoms</div>
          <div class="carousel" id="carousel-bottom"></div>
        </div>

        <div class="category-group">
          <div class="category-title">shoes</div>
          <div class="carousel" id="carousel-shoes"></div>
        </div>

        <div class="category-group">
          <div class="category-title">outerwear</div>
          <div class="carousel" id="carousel-outerwear"></div>
        </div>

      </div>

    </div>
  </div>

  <script>
    const NOTION_TOKEN = "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";
const WARDROBE_DB_ID = "40eaedaf73e8806dbddfdef92af3548e";

let wardrobeItems = [];
let selectedOutfit = {
  top: null,
  bottom: null,
  shoes: null,
  outerwear: null
};

// 1. fetch real items from your notion wardrobe database
async function fetchWardrobeFromNotion() {
  try {
    const response = await fetch(`https://api.notion.com/v1/databases/${WARDROBE_DB_ID}/query`, {
      method: "POST",
      headers: {
        "Authorization": `Bearer ${NOTION_TOKEN}`,
        "Notion-Version": "2022-06-28",
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        filter: {
          property: "Status",
          select: { equals: "clean" } // only show clean items
        }
      })
    });

    const data = await response.json();

    wardrobeItems = data.results.map(page => {
      const props = page.properties;
      return {
        id: page.id,
        name: props.Name?.title[0]?.plain_text || "unnamed",
        category: props.Category?.select?.name?.toLowerCase() || "top",
        url: props["Image URL"]?.url || props["Image URL"]?.rich_text[0]?.plain_text || ""
      };
    });

    renderCarousels(wardrobeItems);
  } catch (err) {
    console.error("failed to load notion wardrobe:", err);
  }
}

// 2. render carousels
function renderCarousels(items) {
  const categories = ['top', 'bottom', 'shoes', 'outerwear'];
  
  categories.forEach(cat => {
    const container = document.getElementById(`carousel-${cat}`);
    if (!container) return;
    
    const catItems = items.filter(i => i.category === cat);

    if (catItems.length === 0) {
      container.innerHTML = `<span style="font-size:0.8rem; color:var(--subtext);">no ${cat}s found</span>`;
      return;
    }

    container.innerHTML = catItems.map(item => `
      <div class="item-card" onclick="selectItem('${cat}', '${item.url}', '${item.name}', this)">
        <img src="${item.url}" alt="${item.name}" crossorigin="anonymous" />
        <span>${item.name}</span>
      </div>
    `).join('');
  });
}

// 3. handle item selection
function selectItem(category, url, name, element) {
  const parent = element.parentElement;
  parent.querySelectorAll('.item-card').forEach(el => el.classList.remove('selected'));
  element.classList.add('selected');

  selectedOutfit[category] = { url, name };
  drawOutfitCanvas();
}

// 4. synchronous canvas drawing for overlapping layered images
async function drawOutfitCanvas() {
  const canvas = document.getElementById('outfit-canvas');
  const ctx = canvas.getContext('2d');
  
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const layers = ['shoes', 'bottom', 'top', 'outerwear']; // drawn bottom-to-top

  for (const layer of layers) {
    if (selectedOutfit[layer] && selectedOutfit[layer].url) {
      await drawSingleLayer(ctx, selectedOutfit[layer].url, layer);
    }
  }
}

function drawSingleLayer(ctx, url, layer) {
  return new Promise((resolve) => {
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.src = url;
    img.onload = () => {
      // positioning logic per layer
      if (layer === 'shoes') ctx.drawImage(img, 80, 210, 140, 90);
      if (layer === 'bottom') ctx.drawImage(img, 75, 120, 150, 110);
      if (layer === 'top') ctx.drawImage(img, 70, 40, 160, 110);
      if (layer === 'outerwear') ctx.drawImage(img, 50, 20, 200, 180);
      resolve();
    };
    img.onerror = () => resolve(); // skip gracefully if image fails
  });
}

// run on load
fetchWardrobeFromNotion();
  </script>
</body>
</html>
